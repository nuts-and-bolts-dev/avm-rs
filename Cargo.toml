[package]
authors = ["Manuel Mauro"]
description = "A Rust implementation of the Algorand Virtual Machine (AVM)"
edition = "2024"
keywords = ["algorand", "blockchain", "smart-contracts", "teal", "avm"]
license = "MIT OR Apache-2.0"
name = "avm-rs"
readme = "README.md"
repository = "https://github.com/nuts-and-bolts-dev/avm-rs"
version = "0.1.2"

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]

[dependencies]
anyhow = "1.0"
base32 = "0.5.1"
base64 = "0.22"
clap = { version = "4.0", features = ["derive", "color"] }
ed25519-dalek = "2.0"
hex = "0.4"
k256 = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"

# Advanced cryptography dependencies
vrf = "0.2"

# Zero-knowledge proof dependencies
arkworks-mimc = "0.3.0"
poseidon-rs = "0.0.10"

# Elliptic curve dependencies (compatible with arkworks-mimc)
ark-bls12-381 = "0.3"
ark-bn254 = "0.3"
ark-ec = "0.3"
ark-ff = "0.3"
ark-serialize = "0.3"
ark-std = "0.3"

# Optional tracing dependencies
tracing = { version = "0.1", optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
quickcheck = "1.0"
quickcheck_macros = "1.0"
tokio = { version = "1.0", features = ["full"] }
